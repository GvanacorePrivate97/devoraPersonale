# Ambiente completo: API + Postgres. Per lo sviluppo quotidiano bastano
# `npm run dev` e un Postgres locale; questo serve a chi parte da zero e al deploy.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mencare
      POSTGRES_PASSWORD: mencare
      POSTGRES_DB: mencare
    ports:
      - '5432:5432'
    volumes:
      - mencare-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mencare -d mencare']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://mencare:mencare@db:5432/mencare
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?serve un segreto di almeno 32 caratteri}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?serve un segreto di almeno 32 caratteri}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      UPLOADS_DIR: /data/uploads
    ports:
      - '3000:3000'
    volumes:
      - mencare-uploads:/data/uploads

volumes:
  mencare-db:
  mencare-uploads:
